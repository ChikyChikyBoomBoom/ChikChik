name: Build ChikChik APK (small, arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PEXELS_API_KEY: UHNwrtMvWliTUlKtr5c6liExzAHxkTBnNfUaVe6gb3jYvSKWNhEIkkNz
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK (arm64-v8a only)
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          cd "$DIR"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > chikchik-release.jks
            printf 'storeFile=chikchik-release.jks\nstorePassword=%s\nkeyAlias=chikchik\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          fi
          gradle assembleRelease --no-daemon -PabiOnly=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: ChikChik-APK-arm64
          path: "**/app-release.apk"
          if-no-files-found: error
